# Publica o site no GitHub Pages a cada push na main.
# No repo: Settings > Pages > Source: GitHub Actions
name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # atualiza o "jogado recentemente" da Steam a cada 6 horas
  schedule:
    - cron: '17 */6 * * *'
# o build só lê o repo; só o job de deploy recebe permissão de publicar no Pages
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Steam (últimos jogos)
        run: node scripts/steam.mjs
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
